[project]
name = "python-ai-homework"
version = "0.1.0"
description = "Teme pentru cursul Python/AI"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.23.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
